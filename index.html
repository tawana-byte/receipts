<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Receipt Book</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#2b4fd8">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{--bg:#f4f6fb;--card:#fff;--tx:#1b2330;--mu:#667;--ln:#c9d0e0;--ac:#2b4fd8;--dg:#c62828;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12151c;--card:#1c212c;--tx:#eef1f7;--mu:#98a;--ln:#39414f;--ac:#7b97ff;--dg:#ff7a7a}}
:root[data-theme="dark"]{--bg:#12151c;--card:#1c212c;--tx:#eef1f7;--mu:#98a;--ln:#39414f;--ac:#7b97ff;--dg:#ff7a7a}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px system-ui,-apple-system,"Segoe UI",sans-serif;padding:12px}
.wrap{max-width:560px;margin:0 auto}
.card{background:var(--card);border:1px solid var(--ln);border-radius:14px;padding:16px;margin-bottom:14px}
h1{text-align:center;font-size:22px;margin:4px 0 12px;letter-spacing:.5px}
h2{font-size:16px;margin:0 0 10px}
label.f{display:block;font-size:13px;color:var(--mu);margin:10px 0 4px}
input[type=text],input[type=date],input[type=number]{width:100%;padding:11px;border:1px solid var(--ln);border-radius:10px;background:var(--bg);color:var(--tx);font-size:16px}
.checks{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.chk{display:flex;align-items:center;gap:8px;padding:12px;border:1px solid var(--ln);border-radius:10px;cursor:pointer;font-size:15px}
.chk input{width:22px;height:22px;accent-color:var(--ac)}
.row{display:grid;grid-template-columns:1fr 110px;gap:8px;margin-bottom:8px;align-items:center}
.total{display:flex;justify-content:space-between;font-weight:700;font-size:20px;padding-top:10px;border-top:2px solid var(--ln);margin-top:6px}
canvas{width:100%;height:130px;border:1px dashed var(--ln);border-radius:10px;background:#fff;touch-action:none;display:block}
button{font:inherit;padding:12px 16px;border-radius:10px;border:0;background:var(--ac);color:#fff;cursor:pointer}
button.s{background:transparent;color:var(--ac);border:1px solid var(--ac);padding:6px 12px;font-size:14px}
button.d{background:transparent;color:var(--dg);border:1px solid var(--dg);padding:6px 12px;font-size:14px}
.btns{display:flex;gap:8px}.btns button{flex:1}
.item{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid var(--ln)}
